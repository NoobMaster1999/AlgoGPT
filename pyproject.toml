[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "algogpt"
version = "0.1.0"
description = "AlgoGPT + Kronos: AI-Powered Options Intelligence for Indian Derivatives"
readme = "README.md"
authors = [{name = "Soumen Basak"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",
    "yfinance>=0.2.0",
    "huggingface_hub>=0.20.0",
    "safetensors>=0.4.0",
    "einops>=0.7.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
plotting = ["matplotlib>=3.7.0"]
upstox = ["upstox-client>=1.0.0"]
nse = ["nsepython>=1.0.0"]
tracking = ["comet-ml>=3.40.0"]
dev = ["pytest>=7.0.0", "black", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["algogpt*"]