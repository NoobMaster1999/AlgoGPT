name: Dashboard checks
on:
  pull_request:
    paths:
      - 'algogpt/**'
      - 'docs/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/dashboard*.yml'
      - 'run_update.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r algogpt/requirements-dashboard.txt
          npm install --prefix "$RUNNER_TEMP/dashboard-qa" playwright@1.57.0
          "$RUNNER_TEMP/dashboard-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify publisher, scorecard and published data
        run: |
          python -m unittest discover -s tests -v
          python scripts/check_dashboard.py
      - name: Exercise the dashboard in Chromium
        run: |
          python -m http.server 8080 --directory docs --bind 127.0.0.1 &
          trap 'kill $!' EXIT
          curl --retry 5 --retry-connrefused --fail --silent http://127.0.0.1:8080/ -o /dev/null
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/dashboard-qa/node_modules/playwright" node tests/dashboard-browser.cjs
